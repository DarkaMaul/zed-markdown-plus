[package]
name = "markdown-folds-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["DarkaMaul"]
repository = "https://github.com/DarkaMaul/zed-markdown-plus"
description = "Local Markdown folding and fenced-code highlighting language server"
publish = false

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
