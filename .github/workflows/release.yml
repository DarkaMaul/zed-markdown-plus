name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  validate-version:
    name: Validate release version
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/package-release.sh check-version "$RELEASE_TAG"

  build-server:
    name: Build server (${{ matrix.asset }})
    needs: [checks, validate-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            asset: linux-x86_64
          - os: macos-26
            asset: macos-aarch64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build, test, and package server
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET: ${{ matrix.asset }}
        run: bash scripts/package-release.sh package "$RELEASE_TAG" "$ASSET"

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Create draft GitHub release
    needs: build-server
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "$RELEASE_TAG" \
            dist/*
